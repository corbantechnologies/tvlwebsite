name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: tvl_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint (errors fail the build; warnings are the known backlog)
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Integration tests (real Postgres, fake Paystack, no email)
        run: npm run test:integration
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/tvl_test

      - name: Build
        run: npm run build
